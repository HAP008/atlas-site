# gitleaks config (https://github.com/gitleaks/gitleaks, MIT). Runs in CI over the full git history.
# Nothing leaves the CI runner: gitleaks is a local binary, no upload.
title = "ATLAS site"

[extend]
useDefault = true

# CLAUDE.md §7.1: the waitlist endpoint lives in the NEXT_PUBLIC_WAITLIST_ENDPOINT variable, never in the repo.
[[rules]]
id = "formspree-endpoint"
description = "A real Formspree form endpoint committed to the repo"
regex = '''formspree\.io/f/[A-Za-z0-9]{6,}'''
keywords = ["formspree.io/f/"]

  [[rules.allowlists]]
  description = "Documentation placeholders and the fake endpoint used in tests"
  regexTarget = "match"
  regexes = ['''formspree\.io/f/(x{6,}|test[0-9a-z]*|abc123)''']

# CLAUDE.md §7.9: waitlist emails are personal data and must never be committed.
[[rules]]
id = "email-address"
description = "An email address other than the public contact or a test address"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'''

  [[rules.allowlists]]
  description = "The public contact address, reserved test domains and package@version strings"
  regexTarget = "match"
  regexes = [
    '''^huzaifapardiwala@gmail\.com$''',
    '''@([a-z0-9-]+\.)*example\.[a-z.]+$''',
    '''\.(test|invalid|example|tld)$''',
    '''^(you|test|hello|dmarc)@''',
  ]

  [[rules.allowlists]]
  description = "Lockfile and generated notices contain package names, not people"
  paths = ['''package-lock\.json$''', '''^NOTICES$''']
